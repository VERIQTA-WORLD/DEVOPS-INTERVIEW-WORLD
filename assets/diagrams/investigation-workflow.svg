<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><rect width="1080" height="1350" fill="#f4faf7"/><g font-family="Arial"><text x="540" y="110" text-anchor="middle" font-size="42" fill="#0a7c66">Interview investigation workflow</text><rect x="180" y="180" width="720" height="110" rx="15" fill="#0a7c66"/><text x="540" y="247" text-anchor="middle" font-size="34" fill="white">1. Understand impact</text><path d="M540 295v43m-12-12 12 12 12-12" fill="none" stroke="#0a7c66" stroke-width="4"/><rect x="180" y="350" width="720" height="110" rx="15" fill="#0a7c66"/><text x="540" y="417" text-anchor="middle" font-size="34" fill="white">2. Gather evidence</text><path d="M540 465v43m-12-12 12 12 12-12" fill="none" stroke="#0a7c66" stroke-width="4"/><rect x="180" y="520" width="720" height="110" rx="15" fill="#0a7c66"/><text x="540" y="587" text-anchor="middle" font-size="34" fill="white">3. Test hypotheses</text><path d="M540 635v43m-12-12 12 12 12-12" fill="none" stroke="#0a7c66" stroke-width="4"/><rect x="180" y="690" width="720" height="110" rx="15" fill="#0a7c66"/><text x="540" y="757" text-anchor="middle" font-size="34" fill="white">4. Identify root cause</text><path d="M540 805v43m-12-12 12 12 12-12" fill="none" stroke="#0a7c66" stroke-width="4"/><rect x="180" y="860" width="720" height="110" rx="15" fill="#0a7c66"/><text x="540" y="927" text-anchor="middle" font-size="34" fill="white">5. Apply controlled fix</text><path d="M540 975v43m-12-12 12 12 12-12" fill="none" stroke="#0a7c66" stroke-width="4"/><rect x="180" y="1030" width="720" height="110" rx="15" fill="#0a7c66"/><text x="540" y="1097" text-anchor="middle" font-size="34" fill="white">6. Verify recovery</text><text x="540" y="1290" text-anchor="middle" font-size="24" fill="#0a7c66">VERIQTA</text></g></svg>